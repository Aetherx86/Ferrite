name: Apple

# Apple runners can wait in a long queue, so this runs apart from the main checks.
on:
  push:
    branches: [main]
    paths: ["shared/**", "iosApp/**", "gradle/**", "*.kts", ".github/workflows/apple.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$RUNNER_TEMP/build"
